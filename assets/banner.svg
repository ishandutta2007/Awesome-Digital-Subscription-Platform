<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background: #0f172a; border-radius: 12px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <!-- Card Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.08)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.08); }
    }
    @keyframes dashFlow {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes floatParticle {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-12px); }
    }
    @keyframes rotateRing {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .pulsing-orb { animation: pulseGlow 6s ease-in-out infinite; transform-origin: 1000px 80px; }
    .floating-card { animation: floatParticle 5s ease-in-out infinite; }
    .flowing-line { stroke-dasharray: 20 10; animation: dashFlow 20s linear infinite; }
    .rotating-ring { animation: rotateRing 25s linear infinite; transform-origin: 1050px 180px; }
  </style>

  <!-- Base Background -->
  <rect width="1200" height="360" rx="12" fill="url(#bgGradient)"/>

  <!-- Dynamic Background Ambient Orbs -->
  <circle cx="1000" cy="80" r="180" fill="#6366f1" opacity="0.25" filter="url(#subtleGlow)" class="pulsing-orb"/>
  <circle cx="200" cy="300" r="150" fill="#a855f7" opacity="0.2" filter="url(#subtleGlow)"/>

  <!-- Background Decorative Grid Lines -->
  <path d="M0 60 H1200 M0 120 H1200 M0 180 H1200 M0 240 H1200 M0 300 H1200" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <path d="M200 0 V360 M400 0 V360 M600 0 V360 M800 0 V360 M1000 0 V360" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>

  <!-- Background Subscriptions Growth Chart Curve -->
  <path d="M 650 280 Q 780 260, 850 190 T 1120 90" fill="none" stroke="url(#accentGrad)" stroke-width="4" filter="url(#glow)" opacity="0.6"/>
  <path d="M 650 280 Q 780 260, 850 190 T 1120 90" fill="none" stroke="#ffffff" stroke-width="2" class="flowing-line" opacity="0.8"/>

  <!-- Dynamic Visual Elements: Geometric Subscriptions Ring (Right Side Background) -->
  <g class="rotating-ring" opacity="0.4">
    <circle cx="1050" cy="180" r="110" fill="none" stroke="url(#accentGrad)" stroke-width="2" stroke-dasharray="8 12"/>
    <circle cx="1050" cy="180" r="75" fill="none" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="4 8"/>
  </g>

  <!-- Background Floating Metrics Cards (Right Side) -->
  <g class="floating-card" opacity="0.85">
    <rect x="860" y="130" width="180" height="70" rx="10" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1"/>
    <text x="880" y="156" fill="#94a3b8" font-size="12" font-weight="600">RECURRING REVENUE</text>
    <text x="880" y="184" fill="#38bdf8" font-size="20" font-weight="800">+$124.5k <tspan font-size="12" fill="#4ade80">↑ 24%</tspan></text>
  </g>

  <g class="floating-card" style="animation-delay: -2.5s;" opacity="0.85">
    <rect x="940" y="220" width="170" height="65" rx="10" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1"/>
    <text x="955" y="244" fill="#94a3b8" font-size="11" font-weight="600">ACTIVE SUBSCRIBERS</text>
    <text x="955" y="270" fill="#a855f7" font-size="18" font-weight="800">18,420 <tspan font-size="11" fill="#c084fc">MRR</tspan></text>
  </g>

  <!-- FOREGROUND CONTENT: Header & Badges -->

  <!-- Top Badge Pill -->
  <rect x="70" y="45" width="230" height="32" rx="16" fill="rgba(99, 102, 241, 0.15)" stroke="#6366f1" stroke-width="1.5"/>
  <text x="85" y="66" fill="#a5b4fc" font-size="12" font-weight="700" letter-spacing="1">💳 RECURRING REVENUE ECOSYSTEM</text>

  <!-- Main Title -->
  <text x="70" y="135" fill="#ffffff" font-size="38" font-weight="900" letter-spacing="-0.5">
    Awesome Digital Subscription Platform 🚀
  </text>

  <!-- Dynamic Gradient Accent Bar Under Title -->
  <rect x="70" y="152" width="580" height="5" rx="2.5" fill="url(#accentGrad)" filter="url(#glow)"/>

  <!-- Subtitle -->
  <text x="70" y="195" fill="#cbd5e1" font-size="17" font-weight="500">
    Curated List of SaaS Platforms &amp; Open-Source Projects for Recurring Billing,
  </text>
  <text x="70" y="222" fill="#94a3b8" font-size="16" font-weight="400">
    Entitlements, Metering, Paywalls, &amp; Membership Monetization Stacks.
  </text>

  <!-- Feature Pills Footer -->
  <g transform="translate(70, 260)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="145" height="34" rx="8" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.12)"/>
    <text x="14" y="21" fill="#f8fafc" font-size="12" font-weight="600">⚡ Usage Billing</text>

    <!-- Pill 2 -->
    <rect x="155" y="0" width="135" height="34" rx="8" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.12)"/>
    <text x="169" y="21" fill="#f8fafc" font-size="12" font-weight="600">🔒 Paywalls</text>

    <!-- Pill 3 -->
    <rect x="300" y="0" width="155" height="34" rx="8" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.12)"/>
    <text x="314" y="21" fill="#f8fafc" font-size="12" font-weight="600">💎 Open Source</text>
  </g>
</svg>
